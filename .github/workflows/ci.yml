name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only supersede PR runs. A newer push to main must never cancel a run that is
  # about to release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - 'docker/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - '.dockerignore'
              - '.github/workflows/ci.yml'

  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .nvmrc
          cache: true

      # Builds every package, then check, type-check and tests.
      - run: vp run ci

  docker:
    name: Build production image
    needs: changes
    # Always build on main so a broken image is caught before release; on PRs
    # only when something the image depends on changed.
    if: github.event_name != 'pull_request' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: artificer-runtime:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Version and publish
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: artificer-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      # A GitHub App token (not GITHUB_TOKEN) so the version PR and the tags the
      # release pushes trigger workflows.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # Do not set registry-url on setup-vp: it writes a placeholder _authToken
      # line that blocks npm Trusted Publishing (OIDC). Registry is in .npmrc.
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .nvmrc
          cache: true

      # Trusted Publishing needs npm >= 11.5.1. Do not use npm@latest: npm 12
      # rejects --git-checks, which pnpm forwards when changeset publish runs
      # pnpm publish.
      - name: Use npm compatible with pnpm publish
        run: npm install -g 'npm@^11.5.1'

      # `publish-packages` builds runtime, the UI bundle and the CLI, then runs
      # `changeset publish` (each package's prepublishOnly builds it again).
      - uses: changesets/action@v1
        with:
          version: vp exec changeset version
          publish: vp run publish-packages
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
