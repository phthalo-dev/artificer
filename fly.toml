# Fly.io deployment config for Artificer runtime + UI
# Before deploying:
#   1. Run: fly launch --no-deploy  (to register the app and create fly.toml)
#      Or update `app` below to match your app name from `fly apps create`
#   2. Set required secrets:
#        fly secrets set LLM_API_KEY=sk-...
#        fly secrets set ARTIFICER_API_KEY=$(openssl rand -hex 32)
#   3. Run: fly deploy

app = "artificer"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4100"
  ARTIFICER_EXEC_DIR = "/data"

[http_service]
  internal_port = 4100
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "artificer_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
