<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artificer Runtime</title>
    <script>
      // Mirrors Var UI getColorModeInitScript({ storageKey: 'theme' }) so the
      // first paint uses the saved color mode.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('theme');
        } catch (e) {}
        var root = document.documentElement;
        root.classList.add('theme-var-ui-default');
        if (stored === 'light' || stored === 'dark') {
          root.setAttribute('data-color-mode', stored);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
